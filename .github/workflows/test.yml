# Lint, build and run the test suite on every push and pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Builds the client, then runs unit, API, update and browser tests.
      # The browser tests use the Google Chrome that GitHub's Ubuntu runners include.
      - run: npm test
      - name: Release zip builds
        run: npm run build
