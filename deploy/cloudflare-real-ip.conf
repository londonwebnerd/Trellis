# Behind Cloudflare: give Trellis each visitor's real IP address.
#
# Without this, nginx sees Cloudflare's address instead of the visitor's, so
# everyone arriving through the same Cloudflare data centre looks like one
# visitor: unique-visitor counts are too low, and the sign-in, contact-form
# and statistics limits are shared by all of them (one person could use up
# the sign-in attempts for everybody).
#
# nginx only believes the CF-Connecting-IP header when the request really comes
# from Cloudflare (the ranges below), so it can't be faked by connecting to
# your server directly.
#
#   sudo cp deploy/cloudflare-real-ip.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare's ranges change rarely; to refresh them:
#   (curl -s https://www.cloudflare.com/ips-v4; echo; curl -s https://www.cloudflare.com/ips-v6) \
#     | sed '/^$/d; s/.*/set_real_ip_from &;/'
# Ranges as of October 2026 (https://www.cloudflare.com/ips/):

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
