# Example nginx site for Trellis.
# Copy to /etc/nginx/sites-available/trellis, adjust server_name and
# certificate paths, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
# (Certificates: `certbot --nginx -d example.com` will fill in the ssl_ lines for you.)

# Login attempts: at most 10 a minute per client address, on top of the
# app's own limit. Put this line once per nginx (it's shared by all sites).
limit_req_zone $binary_remote_addr zone=trellis_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Must be at least the server's 5 MB upload limit.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/auth/login {
        limit_req zone=trellis_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/trellis-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/trellis-proxy.conf;
    }
}

# Requests for any other host name (scanners hitting your IP address, or a
# forged Host header) are dropped instead of reaching an app. Keep exactly
# one default_server per port on the machine.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
